name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, ci/apk-build]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Optional secrets. Without GOOGLE_SERVICES_JSON the app builds without Firebase.
      # Without KEYSTORE_BASE64 only the debug APK is built.
      - name: Add google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        if: env.GOOGLE_SERVICES_JSON != ''
        run: echo "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Add release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p ../keystore
          echo "$KEYSTORE_BASE64" | base64 -d > ../keystore/stylishkeyboardstation.keystore
          echo "HAS_KEYSTORE=true" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        if: env.HAS_KEYSTORE == 'true'
        run: ./gradlew assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: translator-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Publish APK to the debug-latest pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: Latest debug APK
          prerelease: true
          make_latest: false
          files: app/build/outputs/apk/debug/app-debug.apk
